description = "Stage all changes and generate a Conventional Commit message"
prompt = """
$(git add .)
You are a Git expert. I have just staged all my current changes using 'git add .'.
Analyze the following state to write a commit message:

--- GIT STATUS ---
$(git status)

--- GIT DIFF ---
$(git diff --cached)
---

Instructions:
1. Follow the Conventional Commits specification: <type>(<scope>): <subject>
2. Provide a brief description below the title for complex changes.
3. The entire output (title and description) MUST be in English.
4. When a known issue number exists, reference it using a message footer "Closes #<issue-number>"
5. Output ONLY the final commit message. No conversational text, no markdown code blocks, no git commit command until user approval.

If there is absolutely nothing to commit, just say 'No changes detected'.
"""

[options]
temperature = 0.1